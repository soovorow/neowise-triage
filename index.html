<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; margin: 0; padding: .75rem; background: #f4f4f4; border-radius: .25rem; }
    .notice { padding: .75rem; border-radius: .25rem; border: 1px solid; }
    .notice.warn { background: #fff6e5; border-color: #e0a100; }
    .notice.error { background: #fdecec; border-color: #d33; }
    .topic { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div id="result" aria-live="polite"></div>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены и стоимость", other: "Другое" };
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const result = document.querySelector("#result");

    let lastRequestId = 0;
    let inFlight = null;

    function notice(kind, text) {
      const div = document.createElement("div");
      div.className = `notice ${kind}`;
      div.textContent = text;
      result.replaceChildren(div);
    }

    function showReady({ topic, draft }) {
      const topicLine = document.createElement("p");
      topicLine.innerHTML = 'Тема: <span class="topic"></span>';
      topicLine.querySelector(".topic").textContent = TOPIC_LABELS[topic] ?? topic;
      const label = document.createElement("p");
      label.textContent = "Черновик ответа (проверьте перед отправкой клиенту):";
      const pre = document.createElement("pre");
      pre.textContent = draft;
      result.replaceChildren(topicLine, label, pre);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++lastRequestId;
      inFlight?.abort();
      inFlight = new AbortController();
      // Старый черновик убираем сразу: он относится к прошлой заявке.
      notice("warn", "Разбираем заявку…");

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
          signal: inFlight.signal,
        });
        const data = await reply.json();
        if (requestId !== lastRequestId) return; // пришёл ответ на устаревший запрос

        if (data.status === "ready") showReady(data);
        else if (data.status === "invalid_input") notice("error", "Введите текст заявки.");
        else if (data.status === "manual_review")
          notice("warn", "AI не смог надёжно разобрать эту заявку. Определите тему и напишите ответ вручную.");
        else notice("error", "Сервис временно недоступен. Разберите заявку вручную.");
      } catch (error) {
        if (error.name === "AbortError" || requestId !== lastRequestId) return;
        notice("error", "Нет связи с сервером. Разберите заявку вручную.");
      }
    });
  </script>
</body>
</html>
